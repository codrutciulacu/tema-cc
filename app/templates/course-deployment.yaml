apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-deployment
  labels:
    app: nginx-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      imagePullPolicy: IfNotPresent
      containers:
      - name: course-site
        image: course-site
        ports:
        - containerPort: 80
