apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-deployment
  labels:
    app.kubernetes.io/instance: nginx-app
    app.kubernetes.io/name: app
spec:
  replicas: 1
  selector:
     matchLabels:
        app.kubernetes.io/instance: nginx-app
        app.kubernetes.io/name: app
  template:
    metadata:
      labels:
         app.kubernetes.io/instance: nginx-app
         app.kubernetes.io/name: app
    spec:
      containers:
      - name: course-site
        imagePullPolicy: Never
        image: course-site:latest
        env:
           - name: URL
             value: "http://localhost"
           - name: BASE_URL
             value: "/cloud-courses/"
        ports:
        - containerPort: 3000
          name: course
          protocol: TCP
